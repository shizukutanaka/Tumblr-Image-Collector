"""
GitHub Actions CI/CD設定
"""

name: Tumblr Image Collector CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.9'
  POETRY_VERSION: '1.3.2'

jobs:
  # テストジョブ
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Python ${{ matrix.python-version }} のセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: キャッシュの設定
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pytest-cache
          .coverage
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-

    - name: 依存関係のインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: リンターの実行
      run: |
        flake8 tumblr_image_collector/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 tumblr_image_collector/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 型チェックの実行
      run: |
        mypy tumblr_image_collector/ --ignore-missing-imports

    - name: フォーマッタの実行
      run: |
        black --check tumblr_image_collector/
        isort --check-only tumblr_image_collector/

    - name: テストの実行
      run: |
        pytest tests/ -v --tb=short --cov=tumblr_image_collector --cov-report=xml --cov-report=term

    - name: カバレッジレポートのアップロード
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  # セキュリティテスト
  security:
    runs-on: ubuntu-latest
    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: セキュリティツールのインストール
      run: |
        pip install bandit safety

    - name: セキュリティスキャンの実行
      run: |
        bandit -r tumblr_image_collector/ -f json -o bandit-report.json || true
        safety check --json || true

    - name: セキュリティレポートの保存
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # パフォーマンステスト
  performance:
    runs-on: ubuntu-latest
    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 依存関係のインストール
      run: |
        pip install -r requirements.txt
        pip install pytest-benchmark

    - name: パフォーマンステストの実行
      run: |
        pytest tests/test_suite.py::TestPerformance -v --tb=short

  # ドキュメントビルド
  documentation:
    runs-on: ubuntu-latest
    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: ドキュメントツールのインストール
      run: |
        pip install mkdocs mkdocs-material

    - name: ドキュメントのビルド
      run: |
        mkdocs build --clean

    - name: ドキュメントのデプロイ
      if: github.ref == 'refs/heads/main'
      run: |
        mkdocs gh-deploy --force

  # リリースビルド
  build:
    runs-on: ubuntu-latest
    needs: [test, security, performance]
    if: github.event_name == 'release'

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: ビルドツールのインストール
      run: |
        pip install build twine

    - name: パッケージのビルド
      run: |
        python -m build

    - name: パッケージのアップロード
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

  # Dockerイメージのビルド
  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'release'

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: Dockerのセットアップ
      uses: docker/setup-docker-action@v3

    - name: Dockerイメージのビルド
      run: |
        docker build -t tumblr-image-collector:${{ github.event.release.tag_name }} .
        docker build -t tumblr-image-collector:latest .

    - name: Dockerイメージのプッシュ
      if: env.DOCKER_USERNAME && env.DOCKER_PASSWORD
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push tumblr-image-collector:${{ github.event.release.tag_name }}
        docker push tumblr-image-collector:latest
