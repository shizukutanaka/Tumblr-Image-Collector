[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tumblr-image-collector"
version = "2.0.0"
description = "Commercial-grade Tumblr image collection and processing tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Tumblr Image Collector Team", email = "team@example.com"},
]
maintainers = [
    {name = "Tumblr Image Collector Team", email = "team@example.com"},
]
keywords = ["tumblr", "image", "collection", "processing", "ai", "machine-learning", "duplicate-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "pytumblr>=0.1.2",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.1",
    "PySocks>=1.7.1",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.22.0",
    "opencv-python>=4.7.0",
    "scikit-image>=0.19.0",
    "tensorflow>=2.12.0",
    "keras==2.12.0",
    "scikit-learn>=1.2.2",
    "matplotlib>=3.7.1",
    "seaborn>=0.12.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "mypy>=1.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "isort>=5.10.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "pre-commit>=2.20.0",
    "rich>=12.5.0",
    "tqdm>=4.64.0",
    "python-dotenv>=0.20.0",
    "pyyaml>=6.0",
]

[project.scripts]
tumblr-collector = "tumblr_image_collector:main"

[project.urls]
Homepage = "https://github.com/shizukutanaka/Tumblr-Image-Collector"
Documentation = "https://github.com/shizukutanaka/Tumblr-Image-Collector#readme"
Repository = "https://github.com/shizukutanaka/Tumblr-Image-Collector"
Issues = "https://github.com/shizukutanaka/Tumblr-Image-Collector/issues"
Changelog = "https://github.com/shizukutanaka/Tumblr-Image-Collector/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tumblr_image_collector*"]

[tool.setuptools.package-data]
"tumblr_image_collector" = ["locales/*.json", "data/*"]

[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 127
known_first_party = ["tumblr_image_collector"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "skimage.*", "tensorflow.*", "keras.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=tumblr_image_collector",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["tumblr_image_collector"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "docs", "build", "dist"]
skips = ["B101", "B601"]  # 許可する警告

[tool.safety]
ignore = []
